args:
  - --hw-description https://downloads.spacecubics.com/products/scobc-v1/releases/v2026.10/sdt/versal-scobc-v1-ve2302i-revb.tar.gz
  - --machine-name versal-scobc-v1-ve2302i-revb-sdt-full
  - --require-machine scobc-v1-generic
  - -c meta-scobc/conf
  - -g full

machine:
  pre:
    require:
      comment: "Load the SC-OBC Module V1 Rev.B configuration"
      op: 'conf/machine/include/scobc-v1-revb.inc'
  post:
    include:
      comment: "Load the dualboot U-Boot configuration when provided by meta-scobc-dualboot"
      op: 'conf/machine/include/scobc-v1-u-boot.conf'
    SP_FIRMWARE_URI:
      comment: "Safety processor firmware run by QEMU alongside the Versal model"
      op: '?='
      val: 'https://downloads.spacecubics.com/products/scobc-v1/releases/v2026.10/sp-firmware/zephyr.elf;downloadfilename=scobc-v1-sp-firmware-v2026.10.elf'
    SP_FIRMWARE_URI[sha256sum]:
      op: '?='
      val: '88aecc434fd761a75269ae928d5ec431001786a867b1fe2af5da4291c3617715'
