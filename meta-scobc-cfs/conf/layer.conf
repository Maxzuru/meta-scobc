# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "scobc-cfs"
BBFILE_PATTERN_scobc-cfs = "^${LAYERDIR}/"
BBFILE_PRIORITY_scobc-cfs = "6"

LAYERDEPENDS_scobc-cfs = "core"
LAYERSERIES_COMPAT_scobc-cfs = "scarthgap"
